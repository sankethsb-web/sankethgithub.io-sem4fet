<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Order Web Page</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #ff5722;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .menu, .cart {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    button {
      padding: 6px 10px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      background: #ff5722;
      color: white;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .remove {
      background: red;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    .order-btn {
      width: 100%;
      margin-top: 10px;
      background: green;
    }
  </style>
</head>

<body>

<header>🍔 Food Order Web Page</header>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <h2>Menu</h2>

    <div class="item">
      <span>Pizza - ₹200</span>
      <button onclick="addToCart('Pizza',200)">Add</button>
    </div>

    <div class="item">
      <span>Burger - ₹120</span>
      <button onclick="addToCart('Burger',120)">Add</button>
    </div>

    <div class="item">
      <span>Fries - ₹80</span>
      <button onclick="addToCart('Fries',80)">Add</button>
    </div>

    <div class="item">
      <span>Cold Drink - ₹50</span>
      <button onclick="addToCart('Cold Drink',50)">Add</button>
    </div>
  </div>

  <!-- CART -->
  <div class="cart">
    <h2>Your Cart</h2>
    <div id="cartBox"></div>

    <p class="total">Total: ₹<span id="total">0</span></p>

    <button class="order-btn" onclick="placeOrder()">Place Order</button>
  </div>

</div>

<script>
  let cart = [];
  let total = 0;

  function addToCart(name, price) {
    cart.push({ name, price });
    total += price;
    renderCart();
  }

  function renderCart() {
    let box = document.getElementById("cartBox");
    box.innerHTML = "";

    cart.forEach((item, index) => {
      box.innerHTML += `
        <div class="cart-item">
          <span>${item.name} - ₹${item.price}</span>
          <button class="remove" onclick="removeItem(${index})">X</button>
        </div>
      `;
    });

    document.getElementById("total").innerText = total;
  }

  function removeItem(index) {
    total -= cart[index].price;
    cart.splice(index, 1);
    renderCart();
  }

  function placeOrder() {
    if (cart.length === 0) {
      alert("Cart is empty!");
      return;
    }

    alert("🎉 Order Placed Successfully! Total ₹" + total);
    cart = [];
    total = 0;
    renderCart();
  }
</script>

</body>
</html>
