<!DOCTYPE html>
<html>
<head>
    <title>Validation Example</title>
</head>
<body>

<script>
    let name = prompt("Enter your name:");

    if(name == "" || name == null)
    {
        alert("Name cannot be empty!");
    }
    else
    {
        alert("Welcome " + name);
    }
</script>

</body>
</html>
