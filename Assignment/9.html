<!DOCTYPE html>
<html>
<head>
    <title>Form Elements Example</title>
</head>
<body>

<form>

<fieldset>
<legend>Student Details - Sanketh SB</legend>

<p>Select Gender:</p>

<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female

<p>Select Skills:</p>

<input type="checkbox" name="skill" value="HTML"> HTML
<input type="checkbox" name="skill" value="CSS"> CSS
<input type="checkbox" name="skill" value="JavaScript"> JavaScript

<br><br>

<button type="button" onclick="showData()">Submit</button>

</fieldset>

</form>

<script>
function showData()
{
    let skills = document.getElementsByName("skill");
    let result = "Selected Skills: ";

    for(let i = 0; i < skills.length; i++)
    {
        if(skills[i].checked)
        {
            result += skills[i].value + " ";
        }
    }

    alert(result);
}
</script>

</body>
</html>
