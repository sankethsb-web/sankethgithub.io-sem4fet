<!DOCTYPE html>
<html>
<head>
    <title>z-index Example</title>

<style>
.box1 {
    width: 200px;
    height: 200px;
    background-color: red;
    position: absolute;
    top: 50px;
    left: 50px;
    z-index: 1;
}

.box2 {
    width: 200px;
    height: 200px;
    background-color: blue;
    position: absolute;
    top: 100px;
    left: 100px;
    z-index: 2;
}
</style>

</head>
<body>

<h2>Sanketh SB - z-index Demo</h2>

<div class="box1"></div>
<div class="box2"></div>

</body>
</html>
